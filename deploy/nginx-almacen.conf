# Proxy inverso con nginx y HTTPS. En el .env de la app: TRUST_PROXY=1 y COOKIE_SECURE=1
server {
    listen 80;
    server_name almacen.laberit.local;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name almacen.laberit.local;
    ssl_certificate     /etc/ssl/almacen/almacen.crt;
    ssl_certificate_key /etc/ssl/almacen/almacen.key;
    client_max_body_size 60m;

    location /api/events {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
