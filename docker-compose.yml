services:
  almacen:
    build: .
    image: almacen-laberit:1.0
    container_name: almacen-laberit
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
    volumes:
      - ./data:/data
      # - ./certs:/app/certs:ro
