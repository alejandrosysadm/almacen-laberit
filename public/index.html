<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Almacén Laberit</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preload" href="fonts/archivo-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<script src="boot.js"></script>
<style>
  :root{--sp-c:#C8102E;--sp-bg:#FAFAFA;--sp-ink:#18181B;--sp-mut:#71717A;--sp-line:#E4E4E7}
  :root[data-theme="dark"]{--sp-bg:#121214;--sp-ink:#F4F4F5;--sp-mut:#A1A1AA;--sp-line:#2A2A2F}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sp-bg:#121214;--sp-ink:#F4F4F5;--sp-mut:#A1A1AA;--sp-line:#2A2A2F}}
  html,body{margin:0;background:var(--sp-bg)}
  #splash{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:var(--sp-bg);color:var(--sp-ink);font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;transition:opacity .45s ease,visibility .45s}
  #splash::before{content:"";position:absolute;inset:0;background:radial-gradient(600px 380px at 50% 42%,color-mix(in srgb,var(--sp-c) 14%,transparent),transparent 70%);pointer-events:none}
  #splash.out{opacity:0;visibility:hidden}
  .sp-in{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;animation:spUp .6s cubic-bezier(.2,.8,.2,1) both}
  .sp-rack{width:120px;height:96px}
  .sp-rack .post{stroke:var(--sp-ink);stroke-width:3;opacity:.85}
  .sp-rack .shelf{stroke:var(--sp-ink);stroke-width:3;opacity:.85}
  .sp-rack .box{fill:var(--sp-c);opacity:0;animation:spBox 2.4s cubic-bezier(.3,.7,.3,1) infinite}
  .sp-rack .box:nth-of-type(2){animation-delay:.18s}.sp-rack .box:nth-of-type(3){animation-delay:.36s}.sp-rack .box:nth-of-type(4){animation-delay:.54s}
  .sp-rack .box:nth-of-type(5){animation-delay:.72s}.sp-rack .box:nth-of-type(6){animation-delay:.9s}
  #sp-name{font-size:30px;font-weight:800;letter-spacing:-.02em;color:var(--sp-c)}
  #sp-logo{max-height:64px;max-width:240px}
  #sp-logo.on-white{background:#fff;padding:8px 14px;border-radius:10px}
  #sp-sub{font-size:14px;color:var(--sp-mut);margin-top:-6px}
  .sp-bar{width:180px;height:3px;border-radius:3px;background:var(--sp-line);overflow:hidden;margin-top:6px}
  .sp-bar i{display:block;width:40%;height:100%;border-radius:3px;background:var(--sp-c);animation:spBar 1.2s ease-in-out infinite}
  #sp-msg{font-size:13px;color:var(--sp-mut);min-height:16px}
  #sp-msg:empty{display:none}
  #splash[data-anim="pulse"] .sp-rack,#splash[data-anim="none"] .sp-rack{display:none}
  #splash[data-anim="pulse"] #sp-name,#splash[data-anim="pulse"] #sp-logo{animation:spPulse 1.6s ease-in-out infinite}
  #splash[data-anim="none"] .sp-bar i{animation:none;width:100%;opacity:.5}
  #splash[data-bg="white"]{background:#fff;--sp-ink:#18181B;--sp-mut:#71717A;--sp-line:#E4E4E7}
  #splash[data-bg="color"]{background:var(--sp-c);--sp-ink:#fff;--sp-mut:rgba(255,255,255,.82);--sp-line:rgba(255,255,255,.3)}
  #splash[data-bg="color"]::before{background:radial-gradient(600px 380px at 50% 42%,rgba(255,255,255,.16),transparent 70%)}
  #splash[data-bg="color"] #sp-name{color:#fff}
  #splash[data-bg="color"] .sp-rack .box,#splash[data-bg="color"] .sp-bar i{fill:#fff;background:#fff}
  html.no-splash #splash{display:none}
  @keyframes spPulse{50%{transform:scale(1.06);opacity:.75}}
  @keyframes spBox{0%{opacity:0;transform:translateY(-14px)}12%,70%{opacity:1;transform:none}85%,100%{opacity:0;transform:none}}
  @keyframes spBar{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
  @keyframes spUp{from{opacity:0;transform:translateY(10px)}}
  @media (prefers-reduced-motion:reduce){.sp-rack .box{animation:none;opacity:1}.sp-bar i{animation:none;width:100%}}
</style>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="splash" role="status" aria-live="polite" aria-label="Cargando la aplicación">
  <div class="sp-in">
    <svg class="sp-rack" viewBox="0 0 120 96" fill="none" aria-hidden="true">
      <rect class="box" x="22" y="14" width="18" height="16" rx="2"/><rect class="box" x="44" y="14" width="18" height="16" rx="2"/>
      <rect class="box" x="66" y="44" width="18" height="16" rx="2"/><rect class="box" x="22" y="44" width="18" height="16" rx="2"/>
      <rect class="box" x="44" y="74" width="18" height="16" rx="2"/><rect class="box" x="66" y="74" width="18" height="16" rx="2"/>
      <path class="post" d="M14 4v90M106 4v90"/><path class="shelf" d="M14 32h92M14 62h92M14 92h92"/>
    </svg>
    <img id="sp-logo" alt="" hidden>
    <div id="sp-name">Laberit</div>
    <div id="sp-sub">Control de almacén</div>
    <div class="sp-bar"><i></i></div>
    <div id="sp-msg"></div>
  </div>
</div>
<script src="splash.js"></script>
<div id="app"></div>
<div id="layers"></div>
<div id="toasts" role="status" aria-live="polite"></div>
<script src="vendor/qrcode.min.js"></script>
<script src="app.js"></script>
</body>
</html>
